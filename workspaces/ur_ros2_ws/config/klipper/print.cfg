# Complete print.cfg for the first native extruder.
# Source: operator-supplied configuration, 2026-10-19.
# Nozzle: 0.2 mm. Filament: 1.75 mm. Conventional motor-driven filament feed.
# Motor, hotend heater and sensor are configured together under [extruder].

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3E0043000151303532383235-if00

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

#####################################################################
# Extruder 1 — Klipper's first extruder is named "extruder" (T0)
#####################################################################

[extruder]
# Feed motor — original wiring and rotation distance retained.
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 10

# Operator-confirmed dimensions, in mm.
nozzle_diameter: 0.2
filament_diameter: 1.75

# Extrusion-only limits corresponding to the previous manual stepper.
max_extrude_only_velocity: 5
max_extrude_only_accel: 20
# Keep Klipper's default cold-extrusion and extrusion-distance protections.
# min_extrude_temp defaults to 170 C; max_extrude_only_distance to 50 mm.

# Hotend heater and temperature sensor — original parameters retained.
heater_pin: PA2
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 25.013
pid_Ki: 2.566
pid_Kd: 60.966
min_temp: 0
max_temp: 300
max_power: 1.0

# TMC driver settings remain a separate section, bound to the same extruder.
[tmc2209 extruder]
uart_pin: PC4
run_current: 0.8
stealthchop_threshold: 0

#####################################################################
# Lock Motor (M2)
#####################################################################

[manual_stepper lock_motor]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
microsteps: 16
velocity: 5
accel: 50

[tmc2209 manual_stepper lock_motor]
uart_pin: PE1
run_current: 0.80
hold_current: 0.80
stealthchop_threshold: 999999

#####################################################################
# Fans
#####################################################################

[fan]
pin: PA8
max_power: 1.0
kick_start_time: 0.5
off_below: 0.1

[fan_generic fan2]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
off_below: 0.1
